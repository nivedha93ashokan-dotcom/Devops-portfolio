name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t nivedha31/devops-demo-app:1.0 ./projects/devops-demo-app

      - name: Push Docker image
        run: |
          docker push nivedha31/devops-demo-app:1.0

  validate-kubernetes:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes deployment
        run: |
          kubectl apply --dry-run=client \
            -f projects/devops-demo-app/kubernetes/deployment.yaml

      - name: Validate Kubernetes service
        run: |
          kubectl apply --dry-run=client \
            -f projects/devops-demo-app/kubernetes/service.yaml
